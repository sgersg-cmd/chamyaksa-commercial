name: 서울 상권데이터 수집

# 서울 상권분석 데이터는 분기 단위로 갱신되지만 공개 시점이 일정하지 않습니다.
# 매월 1회 확인해 변경이 있을 때만 커밋합니다. (Public repo → Actions 무제한 무료)
on:
  schedule:
    - cron: '0 17 5 * *'   # UTC 17:00 = 매월 6일 새벽 2시 (KST)
  workflow_dispatch:        # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 서울 데이터 수집
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: node scripts/fetch-seoul-data.mjs

      - name: 변경분 확인
        id: diff
        run: |
          if git diff --quiet -- data/seoul-commercial.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 - 커밋을 건너뜁니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node -e "const d=require('./data/seoul-commercial.json');console.log('기준분기',d.quarter,'| 행정동',d.counts.dongs);"
          fi

      - name: 커밋 및 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          QUARTER=$(node -e "console.log(require('./data/seoul-commercial.json').quarter)")
          git add data/seoul-commercial.json
          git commit -m "chore(data): 서울 상권데이터 갱신 (${QUARTER} 기준)"
          git push
