name: 약국 포화도 지표 수집

# 약국·의료기관 개폐업은 서서히 변하므로 반기 1회면 충분합니다.
# 선행 조건: data/sgis 폴더(SGIS 인구통계 수집 완료) + PUBLIC_DATA_KEY Secret
on:
  schedule:
    - cron: '0 19 10 1,7 *'   # UTC 19:00 = 1월·7월 11일 새벽 4시 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 실행 전에 선행 조건을 모두 확인해, 실패 원인을 로그 첫 줄에서 바로 알 수 있게 합니다.
      - name: 선행 조건 확인
        env:
          PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
        run: |
          FAILED=0

          if [ -z "$PUBLIC_DATA_KEY" ]; then
            echo "::error::PUBLIC_DATA_KEY Secret이 등록되지 않았습니다."
            echo "  → GitHub repo → Settings → Secrets and variables → Actions"
            echo "  → [New repository secret] → Name: PUBLIC_DATA_KEY"
            echo "  → 값: 공공데이터포털 일반 인증키(Decoding)"
            FAILED=1
          else
            echo "PUBLIC_DATA_KEY 등록 확인 (길이 ${#PUBLIC_DATA_KEY}자)"
          fi

          if [ ! -d "data/sgis" ]; then
            echo "::error::data/sgis 폴더가 없습니다. 「SGIS 인구통계 수집」 워크플로를 먼저 실행하세요."
            FAILED=1
          else
            COUNT=$(ls data/sgis/*.json 2>/dev/null | wc -l)
            if [ "$COUNT" -lt 2 ]; then
              echo "::error::data/sgis 안에 시도별 파일이 부족합니다. (현재 ${COUNT}개)"
              FAILED=1
            else
              echo "SGIS 인구 파일 ${COUNT}개 확인"
            fi
          fi

          exit $FAILED

      - name: 약국 포화도 수집
        env:
          PUBLIC_DATA_KEY: ${{ secrets.PUBLIC_DATA_KEY }}
        run: node scripts/fetch-pharmacy-density.mjs

      - name: 변경분 확인
        id: diff
        run: |
          # git diff 는 새로 생성된 파일(untracked)을 감지하지 못합니다.
          # 첫 실행에서 커밋이 통째로 건너뛰어지므로 반드시 git status 로 판정합니다.
          if [ ! -f "data/pharmacy-density.json" ]; then
            echo "::error::수집 결과 파일이 생성되지 않았습니다."
            exit 1
          fi
          node -e "const d=require('./data/pharmacy-density.json');console.log('시군구',d.national.districtCount,'| 인구매칭',d.national.matchedCount,'| 약국',d.national.totalPharmacies,'| 배후인구 중앙값',d.national.medianPopulationPerPharmacy);"
          if [ -n "$(git status --porcelain -- data/pharmacy-density.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "변경 감지 - 커밋을 진행합니다."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "변경 없음 - 커밋을 건너뜁니다."
          fi

      - name: 커밋 및 푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pharmacy-density.json
          git commit -m "chore(data): 약국 포화도 지표 갱신"
          git push
